<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Kreator stron</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="themes/fonts.css">
<link rel="stylesheet" href="themes/chat.css">
<link rel="stylesheet" href="themes/motion.css">
<script src="version.js"></script>
<script src="themes/games.js"></script>
<script src="themes/fursona.js"></script>
<script src="themes/library.js"></script>
<script src="themes/fusion.js"></script>
<script src="themes/i18n.js"></script>
<script src="themes/socials.js"></script>
<script src="themes/chat.js"></script>
<script src="themes/client.js"></script>
<script src="themes/pagekit.js"></script>
<style>
  /*
    Kreator stron – jak Bubble.io: Projekt (paleta elementów: wizualne, kontenery, pola formularza, stream),
    Workflow („Kiedy… → Zrób…”) i Dane (stany, np. licznik). Strona ≤ 1920×1080 idzie do OBS jako page.html?id=…
  */
  :root { --bg: #0e0f13; --panel: #171920; --line: #2a2d38; --ink: #e9eaf0; --dim: #9ea1ad; --acc: #7c5cff; --guide: #ff3fa4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13.5px/1.35 'Inter', system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 7px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  h1 { font-size: 14px; margin: 0 6px 0 0; white-space: nowrap; }
  button, select, input, textarea { background: #22252f; color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; font: inherit; }
  button { cursor: pointer; } button:hover { filter: brightness(1.2); } button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
  input[type=number] { width: 100%; } input[type=color] { padding: 0; width: 34px; height: 28px; }
  .sp { flex: 1; }
  .work { display: grid; grid-template-columns: 56px 210px 1fr 270px; min-height: 0; }
  .rail { background: #121318; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; padding: 8px 6px; }
  .rail button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px; font-size: 10.5px; border: 0; background: none; color: var(--dim); }
  .rail button i { font-style: normal; font-size: 18px; }
  .rail button[aria-pressed="true"] { background: color-mix(in srgb, var(--acc) 25%, #1d2027); color: #fff; }
  aside { background: var(--panel); overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  aside.l { border-right: 1px solid var(--line); } aside.r { border-left: 1px solid var(--line); }
  .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-top: 6px; }
  .cat > summary { cursor: pointer; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); padding: 4px 0; list-style: none; }
  .cat > summary::before { content: '▾ '; } .cat:not([open]) > summary::before { content: '▸ '; }
  .pal { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 6px; }
  .pal button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; font-size: 11.5px; touch-action: none; cursor: grab; }
  .pal button i { font-style: normal; font-size: 17px; min-height: 20px; }
  .layers { display: flex; flex-direction: column; gap: 3px; }
  .layers button { text-align: left; display: flex; gap: 6px; align-items: center; padding: 5px 7px; font-size: 12px; }
  .layers button.sel { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 25%, #22252f); }
  .layers button.child { margin-left: 14px; }
  .layers button small { margin-left: auto; color: var(--dim); }
  main { min-height: 0; overflow: hidden; position: relative; display: grid; }
  #design { display: grid; place-items: center; padding: 14px; min-height: 0; }
  #wrap { position: relative; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: repeating-conic-gradient(#1b1d24 0 25%, #15171d 0 50%) 0 0 / 40px 40px; box-shadow: 0 0 0 1px var(--line), 0 10px 40px rgba(0,0,0,.6); }
  #stage .vmp-el.off { opacity: .35; } #stage .vmp-el.pilot { outline: 2px dashed #ffd43b; }
  #boxes { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .box { position: absolute; border: 2px dashed transparent; cursor: move; touch-action: none; }
  .box:hover { border-color: rgba(255,255,255,.5); }
  .box.sel { border: 4px solid var(--acc); z-index: 999 !important; }
  .box .tag { position: absolute; left: -4px; top: -34px; padding: 3px 10px; border-radius: 6px; background: var(--acc); color: #fff; font: 600 20px/1.2 Inter, sans-serif; white-space: nowrap; display: none; }
  .box.sel .tag { display: block; }
  .h { position: absolute; width: 30px; height: 30px; background: var(--acc); border: 4px solid #fff; border-radius: 50%; display: none; touch-action: none; }
  .sel .h { display: block; }
  .h.nw { left: -17px; top: -17px; cursor: nwse-resize; } .h.ne { right: -17px; top: -17px; cursor: nesw-resize; }
  .h.sw { left: -17px; bottom: -17px; cursor: nesw-resize; } .h.se { right: -17px; bottom: -17px; cursor: nwse-resize; }
  .guide { position: absolute; background: var(--guide); pointer-events: none; z-index: 1000; }
  .guide.v { width: 3px; top: 0; bottom: 0; } .guide.hz { height: 3px; left: 0; right: 0; }
  #ghost { position: fixed; z-index: 200; pointer-events: none; padding: 8px 12px; border-radius: 8px; background: var(--acc); color: #fff; font-weight: 600; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  #steps { position: absolute; left: 14px; right: 14px; top: 10px; z-index: 5; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 10px; border-radius: 10px; background: color-mix(in srgb, var(--acc) 18%, #171920); border: 1px solid color-mix(in srgb, var(--acc) 50%, transparent); font-size: 12.5px; }
  #steps b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--acc); color: #fff; font-size: 11px; margin-right: 4px; }
  #steps span { margin-right: 10px; }
  /* Workflow */
  #flow { overflow: auto; padding: 16px; display: none; }
  .wf { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; display: grid; gap: 8px; max-width: 760px; }
  .wf .when { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, #ffd43b 14%, #1d2027); border-left: 4px solid #ffd43b; }
  .wf .act { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; border-radius: 8px; background: #1d2027; border-left: 4px solid var(--acc); }
  .wf .act b, .wf .when b { font-size: 12px; color: var(--dim); }
  .wf select, .wf input { max-width: 220px; }
  .wf input[type=number] { width: 80px; }
  .wf .x { margin-left: auto; padding: 2px 8px; }
  /* Dane */
  .st { display: grid; grid-template-columns: 1fr 1fr auto; gap: 4px; align-items: center; }
  .st code { font-size: 12px; color: #ffd43b; }
  .props { display: flex; flex-direction: column; gap: 7px; }
  .props label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--dim); }
  .props label.row { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); cursor: pointer; }
  .props textarea { min-height: 64px; resize: vertical; }
  .xy { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .colrow { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .colrow button { width: 24px; height: 24px; padding: 0; border-radius: 50%; }
  .colrow button.on { outline: 2px solid #fff; outline-offset: 1px; }
  .tok { align-self: flex-start; font-size: 11.5px; padding: 3px 8px; }
  .hint { color: var(--dim); font-size: 12px; }
  .menu { position: fixed; z-index: 300; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 3px; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-height: 60vh; overflow: auto; }
  .menu button { text-align: left; }
  /* ekran startowy */
  #start { position: fixed; inset: 0; z-index: 150; background: rgba(8,9,12,.96); overflow: auto; padding: 28px; display: none; }
  #start h2 { margin: 0 0 4px; font-size: 22px; } #start p { color: var(--dim); margin: 0 0 18px; }
  .tpls { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .tpl { text-align: left; padding: 0; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; background: #171920; }
  .tpl .mini { position: relative; aspect-ratio: 16 / 9; background: repeating-conic-gradient(#1b1d24 0 25%, #15171d 0 50%) 0 0 / 16px 16px; overflow: hidden; display: grid; place-items: center; }
  .tpl .mini > div { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .tpl b { padding: 10px 12px 2px; font-size: 14px; } .tpl small { padding: 0 12px 12px; color: var(--dim); }
  .tpl:hover { outline: 2px solid var(--acc); filter: none; }
  @media (max-width: 1000px) { .work { grid-template-columns: 48px 1fr; grid-template-rows: auto 1fr auto; } aside.l { grid-column: 2; max-height: 30vh; } main { grid-column: 1 / -1; } aside.r { grid-column: 1 / -1; max-height: 34vh; } .rail { grid-row: 1; } }
</style>
</head>
<body data-base="vmp-edit">
<header>
  <h1>✦ Kreator</h1>
  <select id="pageSel" title="Strona"></select>
  <button id="newBtn">＋ Nowa strona</button>
  <input id="pageName" type="text" placeholder="nazwa strony" style="width:160px">
  <select id="sizeSel" title="Rozmiar (najwyżej 1920×1080)">
    <option value="1920x1080">1920×1080 – cały ekran</option><option value="1280x720">1280×720</option><option value="1080x1080">1080×1080 – kwadrat</option>
    <option value="1920x120">1920×120 – pasek</option><option value="900x260">900×260 – plakietka</option><option value="600x180">600×180 – licznik</option><option value="900x500">900×500 – pilot</option><option value="custom">własny…</option>
  </select>
  <span id="customSize" hidden><input id="pw" type="number" min="50" max="1920" style="width:70px"> × <input id="ph" type="number" min="50" max="1080" style="width:70px"></span>
  <select id="bgSel" title="Tło"><option value="none">tło: przezroczyste</option><option value="theme">tło: kolory postaci</option><option value="dark">tło: ciemne</option><option value="cyber">tło: cyber (siatka i scanline)</option></select>
  <button id="undoBtn" title="Cofnij (Ctrl+Z)">↶</button><button id="redoBtn" title="Ponów (Ctrl+Y)">↷</button>
  <span class="sp"></span>
  <button id="prevBtn" title="Strona tak, jak zobaczy ją OBS">▶ Podgląd</button>
  <button id="pilotBtn" title="Strona z działającymi przyciskami i polami">🎛 Pilot</button>
  <button id="delPage" title="Usuń stronę">🗑</button>
  <button class="primary" id="doneBtn">Gotowe</button>
</header>
<div class="work">
  <nav class="rail">
    <button data-view="design" aria-pressed="true"><i>✎</i>Projekt</button>
    <button data-view="flow"><i>⚡</i>Workflow</button>
    <button data-view="data"><i>▤</i>Dane</button>
  </nav>
  <aside class="l" id="left"></aside>
  <main>
    <div id="design"><div id="steps"></div><div id="wrap"><div id="stage" class="vmp-root"></div><div id="boxes"></div></div></div>
    <div id="flow"></div>
  </main>
  <aside class="r"><div class="props" id="props"></div></aside>
</div>
<div id="ghost"></div>
<div id="start"></div>
<script>
(() => {
  const P = window.VMPages, $ = id => document.getElementById(id);
  P.injectCss();
  const q = new URLSearchParams(location.search), embed = q.get('embed') === '1';
  if (q.get('slow') === '1') document.documentElement.style.setProperty('--k', 4);
  const SNAP = 10, MIN = 20;
  let page = null, sel = null, scale = 1, undo = [], redo = [], view = 'design';
  const nodes = {};
  const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const opt = (list, v) => list.map(([ov, on]) => `<option value="${esc(ov)}"${String(ov) === String(v) ? ' selected' : ''}>${esc(on)}</option>`).join('');
  const elName = el => el ? (el.name || P.TYPES[el.type].name) : '—';

  // ---------------------------------------------------------------- strony, zapis, cofanie
  function loadPage(id) { const p = P.get(id); page = p ? JSON.parse(JSON.stringify(p)) : null; sel = null; undo = []; redo = []; tools(); }
  let saveT = 0;
  function save() { clearTimeout(saveT); saveT = setTimeout(() => { P.put(JSON.parse(JSON.stringify(page))); fillPages(); }, 150); }
  function remember() { undo.push(JSON.stringify(page)); if (undo.length > 80) undo.shift(); redo = []; tools(); }
  function tools() { $('undoBtn').disabled = !undo.length; $('redoBtn').disabled = !redo.length; }
  function back(from, to) { if (!from.length) return; to.push(JSON.stringify(page)); page = JSON.parse(from.pop()); if (!page.els.some(e => e.id === sel)) sel = null; save(); refresh(); tools(); }
  function fillPages() {
    if (!page) return;
    $('pageSel').innerHTML = P.list().map(p => `<option value="${p.id}"${p.id === page.id ? ' selected' : ''}>${esc(p.name)} · ${p.w}×${p.h}</option>`).join('');
    if (document.activeElement !== $('pageName')) $('pageName').value = page.name;
    const sz = page.w + 'x' + page.h, has = [...$('sizeSel').options].some(o => o.value === sz);
    $('sizeSel').value = has ? sz : 'custom'; $('customSize').hidden = has; $('pw').value = page.w; $('ph').value = page.h;
    $('bgSel').value = page.bg || 'none';
  }

  // ---------------------------------------------------------------- ekran startowy „Co robimy?”
  function miniPreview(box, pg) {
    const inner = document.createElement('div'); inner.className = 'vmp-root'; P.drawBg(inner, pg);
    const c = P.ctx(); for (const el of pg.els) { if (el.visible === false || el.pilotOnly) continue; const d = document.createElement('div'); P.drawEl(d, el, c, 'edit'); inner.appendChild(d); }
    box.appendChild(inner);
    requestAnimationFrame(() => { const k = Math.min(box.clientWidth / pg.w, box.clientHeight / pg.h); inner.style.transform = `scale(${k})`; inner.style.left = (box.clientWidth - pg.w * k) / 2 + 'px'; inner.style.top = (box.clientHeight - pg.h * k) / 2 + 'px'; });
  }
  function showStart() {
    const own = P.list();
    $('start').innerHTML = `<h2>Co robimy?</h2><p>Wybierz gotowy pomysł – dostaniesz działającą stronę, którą potem zmieniasz po swojemu. Każdą stronę możesz pokazać na streamie albo jako pilot.</p>
      <div class="tpls" id="tplGrid">${P.TEMPLATES.map(([k, n, d]) => `<button class="tpl" data-tpl="${k}"><div class="mini"></div><b>${esc(n)}</b><small>${esc(d)}</small></button>`).join('')}</div>
      ${own.length ? `<h2 style="margin-top:26px">Twoje strony</h2><p>Kliknij, żeby edytować.</p><div class="tpls">${own.map(p => `<button class="tpl" data-open="${p.id}"><div class="mini"></div><b>${esc(p.name)}</b><small>${p.w}×${p.h} · ${p.els.length} el. · ${(p.wf || []).length} workflow</small></button>`).join('')}</div>` : ''}
      ${page ? '<p style="margin-top:20px"><button id="startClose">✕ Wróć do edycji</button></p>' : ''}`;
    $('start').style.display = 'block';
    $('start').querySelectorAll('[data-tpl]').forEach(b => miniPreview(b.querySelector('.mini'), P.TEMPLATES.find(t => t[0] === b.dataset.tpl)[3]()));
    $('start').querySelectorAll('[data-open]').forEach(b => miniPreview(b.querySelector('.mini'), P.get(b.dataset.open)));
  }
  $('start').addEventListener('click', e => {
    const t = e.target.closest('[data-tpl]'), o = e.target.closest('[data-open]');
    if (e.target.id === 'startClose') { $('start').style.display = 'none'; return; }
    if (t) { const np = P.TEMPLATES.find(x => x[0] === t.dataset.tpl)[3](); P.put(np); loadPage(np.id); }
    else if (o) loadPage(o.dataset.open);
    else return;
    $('start').style.display = 'none'; fillPages(); setView('design');
  });

  // ---------------------------------------------------------------- widoki: Projekt / Workflow / Dane
  function setView(v) {
    view = v;
    document.querySelectorAll('.rail [data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === v));
    $('design').style.display = v === 'flow' ? 'none' : 'grid'; $('flow').style.display = v === 'flow' ? 'block' : 'none';
    refresh();
  }
  document.querySelector('.rail').onclick = e => { const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view); };
  function refresh() { left(); if (view === 'flow') flow(); else draw(); props(); }

  function left() {
    const L = $('left');
    if (view === 'design') {
      L.innerHTML = P.CATS.map(([c, n], i) => `<details class="cat" ${i < 2 || c === 'stream' || c === 'hud' ? 'open' : ''}><summary>${n}</summary><div class="pal">${Object.entries(P.TYPES).filter(([, t]) => t.cat === c).map(([k, t]) => `<button data-t="${k}" title="Przeciągnij na stronę albo kliknij"><i>${t.icon}</i>${t.name}</button>`).join('')}</div></details>`).join('') +
        `<div class="lbl">Warstwy</div><div class="layers" id="layers"></div>`;
      layers();
    } else if (view === 'flow') {
      L.innerHTML = `<div class="lbl">Workflow</div><p class="hint">Workflow to zasada „<b>Kiedy</b> coś się stanie → <b>Zrób</b> to”. Np. kiedy ktoś napisze <code>!smierc</code> → dodaj 1 do licznika i mrugnij napisem.</p>
        <button class="primary" id="wfAdd">＋ Nowy workflow</button>
        <p class="hint">Zdarzenia z czatu i alerty działają na streamie. Kliknięcia i pola – w pilocie (🎛 u góry albo w panelu: Twórz).</p>`;
      $('wfAdd').onclick = () => { remember(); (page.wf = page.wf || []).push({ id: P.uid(), on: { type: 'command', cmd: '!hej' }, do: [{ type: 'show', el: '', secs: 8 }] }); save(); flow(); };
    } else {
      const st = P.getState();
      L.innerHTML = `<div class="lbl">Dane – stany</div><p class="hint">Stan to zapamiętana wartość, np. licznik śmierci albo temat. W napisie wpisz <code>{nazwa}</code>, a Workflow i pola formularza go zmieniają. Stany są wspólne dla wszystkich stron.</p>
        <div id="stList" style="display:grid;gap:5px">${Object.entries(st).map(([k, v]) => `<div class="st"><code>{${esc(k)}}</code><input data-st="${esc(k)}" value="${esc(v)}"><button data-stdel="${esc(k)}" title="Usuń">✕</button></div>`).join('') || '<p class="hint">Brak stanów.</p>'}</div>
        <div class="st"><input id="stName" placeholder="nazwa (np. smierci)"><input id="stVal" placeholder="wartość" value="0"><button id="stAdd">＋</button></div>`;
      L.oninput = e => { const k = e.target.dataset.st; if (k) { P.setState({ [k]: e.target.value }); draw(); } };
      L.onclick = e => {
        const d = e.target.dataset.stdel; if (d) { const s = P.getState(); delete s[d]; localStorage.setItem(P.STATE, JSON.stringify(s)); left(); draw(); }
        if (e.target.id === 'stAdd') { const k = $('stName').value.trim().replace(/[^\wąćęłńóśźż]/gi, '_'); if (k) { P.setState({ [k]: $('stVal').value }); left(); } }
      };
      return;
    }
    L.oninput = null; L.onclick = null;
  }
  $('left').addEventListener('click', e => { const b = e.target.closest('#layers [data-id]'); if (b) { sel = b.dataset.id; boxes(); layers(); props(); } });

  // ---------------------------------------------------------------- Projekt: rysowanie
  function fit() {
    const m = $('design'), top = $('steps').hidden ? 0 : $('steps').offsetHeight + 10, w = m.clientWidth - 28, h = m.clientHeight - 28 - top;
    scale = Math.max(.05, Math.min(w / page.w, h / page.h, 1));
    $('stage').style.transform = `scale(${scale})`;
    $('wrap').style.width = page.w * scale + 'px'; $('wrap').style.height = page.h * scale + 'px'; $('wrap').style.marginTop = top + 'px';
    Object.assign($('boxes').style, { width: page.w + 'px', height: page.h + 'px', transform: `scale(${scale})` });
  }
  function draw() {
    if (!page || view === 'flow') return;
    const st = $('stage'), c = P.ctx();
    P.drawBg(st, page);
    const ids = new Set(page.els.map(e => e.id));
    for (const k of Object.keys(nodes)) if (!ids.has(k)) { nodes[k].remove(); delete nodes[k]; }
    for (const el of page.els) { let d = nodes[el.id]; if (!d) d = nodes[el.id] = document.createElement('div'); st.appendChild(d); P.drawEl(d, el, c, 'edit'); d.classList.toggle('off', el.visible === false); d.classList.toggle('pilot', !!el.pilotOnly); }
    fit(); boxes(); layers();
  }
  function boxes() {
    const b = $('boxes'); b.textContent = '';
    page.els.forEach((el, i) => {
      const d = document.createElement('div'); d.className = 'box' + (sel === el.id ? ' sel' : ''); d.dataset.id = el.id; d.style.zIndex = i + 1;
      Object.assign(d.style, { left: el.x + 'px', top: el.y + 'px', width: el.w + 'px', height: el.h + 'px' });
      if (sel === el.id) d.innerHTML = `<span class="tag">${esc(elName(el))}</span><i class="h nw" data-h="nw"></i><i class="h ne" data-h="ne"></i><i class="h sw" data-h="sw"></i><i class="h se" data-h="se"></i>`;
      b.appendChild(d);
    });
  }
  function layers() {
    const box = $('layers'); if (!box || !page) return;
    const L = page.els.slice().reverse();
    box.innerHTML = L.length ? L.map(el => { const kids = P.parentsOf(page, el).length, wf = (page.wf || []).some(w => w.on.el === el.id || (w.do || []).some(a => a.el === el.id));

  // ---------------------------------------------------------------- właściwości (prawa kolumna)

  function props() {

  const evName = t => (P.EVENTS.find(e => e[0] === t) || ['', t])[1];
  function wfText(w) {

    const el = page.els.find(x => x.id === sel); if (!el) return;

  $('props').addEventListener('click', e => {
    const el = page.els.find(x => x.id === sel); if (!el) return;

    if (c) { remember(); el.p[c.dataset.col] = c.dataset.v; save(); soft(true); return; }
    if (tk) { tokenMenu(tk, key => { remember(); el.p[tk.dataset.tok] = (el.p[tk.dataset.tok] || '') + `{${key}}`; save(); soft(true); }); return; }
    if (qk) {
      remember(); page.wf = page.wf || [];

    if (a.dataset.a === 'dup') { const n = JSON.parse(JSON.stringify(el)); n.id = P.uid(); n.x += 30; n.y += 30; page.els.splice(i + 1, 0, n); sel = n.id; }
    if (a.dataset.a === 'up' && i < page.els.length - 1) page.els.splice(i + 1, 0, page.els.splice(i, 1)[0]);
    if (a.dataset.a === 'down' && i > 0) page.els.splice(i - 1, 0, page.els.splice(i, 1)[0]);

  });
  function tokenMenu(anchor, pick) {
    closeMenu();

    const states = Object.keys(P.getState()).filter(k => !P.TOKENS.some(t => t[0] === k));
    m.innerHTML = P.TOKENS.map(([k, n]) => `<button data-k="${k}">{${k}} – ${n}</button>`).join('') + states.map(k => `<button data-k="${esc(k)}">{${esc(k)}} – stan</button>`).join('');

  function closeMenu() { const m = $('menu'); if (m) m.remove(); removeEventListener('pointerdown', outside); }
  function soft(full) { const c = P.ctx(); for (const el of page.els) if (nodes[el.id]) { P.drawEl(nodes[el.id], el, c, 'edit'); nodes[el.id].classList.toggle('off', el.visible === false); nodes[el.id].classList.toggle('pilot', !!el.pilotOnly); } boxes(); layers(); if (full) props(); }

  // ---------------------------------------------------------------- Workflow (środek)
  function flow() {
    const F = $('flow'); if (!page) return;
    const els = page.els.map(e => [e.id, `${P.TYPES[e.type].icon} ${elName(e)}`]);
    const elSel = (v, attr) => `<select ${attr}><option value="">— wybierz element —</option>${opt(els, v)}</select>`;
    F.innerHTML = (page.wf || []).map((w, i) => {
      const o = w.on;

        <div class="when"><b>KIEDY</b><select data-o="type">${opt(P.EVENTS, o.type)}</select>
          ${o.type === 'click' ? elSel(o.el, 'data-o="el"') : ''}
          ${o.type === 'alert' ? `<select data-o="alert">${opt(P.ALERT_T, o.alert || 'any')}</select>` : ''}

          ${['show', 'hide', 'toggle', 'pulse'].includes(a.type) ? elSel(a.el, 'data-a="el"') : ''}
          ${['show', 'hide'].includes(a.type) ? `na <input type="number" data-a="secs" value="${a.secs || 0}"> s <span class="hint">(0 = na stałe)</span>` : ''}
          ${['set', 'add'].includes(a.type) ? `stan <input data-a="key" value="${esc(a.key || '')}" list="wfStates" placeholder="nazwa" style="width:120px"> ${a.type === 'set' ? '=' : '+'} <input data-a="value" value="${esc(a.value ?? '')}" placeholder="${a.type === 'set' ? 'wartość, np. {user}' : '1'}" style="width:140px">` : ''}
          ${a.type === 'page' ? `<select data-a="page"><option value="">ta strona</option>${opt(P.list().filter(p => p.w === 1920 && p.h === 1080).map(p => [p.id, p.name]), a.page)}</select>` : ''}

    }).join('') + `<datalist id="wfStates">${Object.keys(P.getState()).map(n => `<option value="${esc(n)}">`).join('')}</datalist>` +
      ((page.wf || []).length ? '' : '<div class="wf"><b>Nie ma jeszcze żadnego workflow.</b><span class="hint">Kliknij „＋ Nowy workflow” po lewej. Przykład: Kiedy przyjdzie alert follow → ustaw stan user = {user} → pokaż „Popup” na 8 s.</span></div>');
  }
  const wfAt = t => { const c = t.closest('.wf'); return c && page.wf[+c.dataset.i]; };
  $('flow').addEventListener('change', e => {
    const t = e.target, w = wfAt(t); if (!w) return;
    remember();
    const v = t.type === 'number' ? +t.value : t.value;
    if (t.dataset.o) { w.on[t.dataset.o] = v; }
    if (t.dataset.a) { const a = w.do[+t.closest('.act').dataset.j]; a[t.dataset.a] = v; }

  });
  $('flow').addEventListener('click', e => {
    const t = e.target, w = wfAt(t); if (!w) return;

    else if (t.dataset.adel != null) { remember(); w.do.splice(+t.dataset.adel, 1); }
    else if (t.dataset.aadd != null) { remember(); w.do.push({ type: 'show', el: '', secs: 0 }); }

  // ---------------------------------------------------------------- paleta: przeciąganie na stronę (albo klik = na środek)
  let pdrag = null;
  $('left').addEventListener('pointerdown', e => {
    const b = e.target.closest('.pal [data-t]'); if (!b) return;
    e.preventDefault(); pdrag = { t: b.dataset.t, x: e.clientX, y: e.clientY, moved: false };
    $('ghost').textContent = P.TYPES[b.dataset.t].icon + ' ' + P.TYPES[b.dataset.t].name;
  });
  addEventListener('pointermove', e => {
    if (!pdrag) return;
    if (Math.hypot(e.clientX - pdrag.x, e.clientY - pdrag.y) > 6) pdrag.moved = true;
    if (pdrag.moved) Object.assign($('ghost').style, { display: 'block', left: e.clientX + 12 + 'px', top: e.clientY + 12 + 'px' });
  });
  addEventListener('pointerup', e => {
    if (!pdrag) return;
    const d = pdrag; pdrag = null; $('ghost').style.display = 'none';
    const r = $('stage').getBoundingClientRect(), inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    if (d.moved && !inside) return;
    remember();
    const el = P.newEl(d.t, page, d.moved ? [(e.clientX - r.left) / scale, (e.clientY - r.top) / scale] : null);
    page.els.push(el); sel = el.id; save(); draw(); props();
  });

  // ---------------------------------------------------------------- przesuwanie i rozmiar na stronie (grupa przesuwa swoje elementy)
  function targets(axis) {
    const t = axis === 'x' ? [0, page.w / 2, page.w] : [0, page.h / 2, page.h];
    for (const e of page.els) { if (e.id === sel || (drag && drag.kids.includes(e))) continue; const a = axis === 'x' ? e.x : e.y, l = axis === 'x' ? e.w : e.h; t.push(a, a + l / 2, a + l); }
    return t;
  }
  const MAG = () => 8 / scale;
  function snapEdge(v, axis, g) { let best = null; for (const t of targets(axis)) { const d = Math.abs(t - v); if (d <= MAG() && (!best || d < best.d)) best = { t, d }; } if (best) { g.push([axis, best.t]); return best.t; } return Math.round(v / SNAP) * SNAP; }
  function snapMove(x, len, axis, g) { let best = null; for (const off of [0, len / 2, len]) for (const t of targets(axis)) { const d = Math.abs(t - (x + off)); if (d <= MAG() && (!best || d < best.d)) best = { x: t - off, t, d }; } if (best) { g.push([axis, best.t]); return best.x; } return Math.round(x / SNAP) * SNAP; }
  function guides(g) { document.querySelectorAll('.guide').forEach(n => n.remove()); for (const [a, t] of g) { const n = document.createElement('div'); n.className = 'guide ' + (a === 'x' ? 'v' : 'hz'); n.style[a === 'x' ? 'left' : 'top'] = (t - 1) + 'px'; $('boxes').appendChild(n); } }
  const rb = (d, dim) => (1 - 1 / ((d * .55) / dim + 1)) * dim, band = (v, lo, hi) => v < lo ? lo - rb(lo - v, 200) : v > hi ? hi + rb(v - hi, 200) : v;
  let drag = null;
  $('boxes').addEventListener('pointerdown', ev => {
    const box = ev.target.closest('.box');
    if (!box) { sel = null; boxes(); layers(); props(); return; }
    ev.preventDefault();
    const el = page.els.find(e => e.id === box.dataset.id); sel = el.id;
    remember();
    const kids = ['group', 'popup'].includes(el.type) ? P.childrenOf(page, el) : [];
    drag = { el, kids, k0: kids.map(k => [k.x, k.y]), h: ev.target.dataset.h || '', x: ev.clientX, y: ev.clientY, r: [el.x, el.y, el.w, el.h] };
    box.setPointerCapture(ev.pointerId); boxes(); layers(); props();
  });
  $('boxes').addEventListener('dblclick', ev => { const f = $('props').querySelector('textarea, input[data-k="label"], input[data-k="text"]'); if (f) { f.focus(); f.select && f.select(); } });
  addEventListener('pointermove', ev => {
    if (!drag) return;
    const dx = (ev.clientX - drag.x) / scale, dy = (ev.clientY - drag.y) / scale, [x, y, w, h] = drag.r, g = [], el = drag.el;
    if (!drag.h) {
      el.x = Math.round(band(snapMove(x + dx, w, 'x', g), 0, page.w - w)); el.y = Math.round(band(snapMove(y + dy, h, 'y', g), 0, page.h - h));
      drag.kids.forEach((k, i) => { k.x = drag.k0[i][0] + (el.x - x); k.y = drag.k0[i][1] + (el.y - y); });
    } else {
      const W = drag.h.includes('w'), N = drag.h.includes('n');
      let l = x, t = y, r = x + w, b = y + h;
      if (W) l = snapEdge(x + dx, 'x', g); else r = snapEdge(x + w + dx, 'x', g);
      if (N) t = snapEdge(y + dy, 'y', g); else b = snapEdge(y + h + dy, 'y', g);
      let nw = Math.max(MIN, r - l), nh = Math.max(MIN, b - t);
      if (ev.shiftKey) { const k = w / h; if (Math.abs(dx) > Math.abs(dy)) nh = nw / k; else nw = nh * k; }
      el.w = Math.round(nw); el.h = Math.round(nh); el.x = Math.round(W ? x + w - nw : x); el.y = Math.round(N ? y + h - nh : y);
    }
    guides(g);
    const c = P.ctx();
    for (const e of [el, ...drag.kids]) { P.drawEl(nodes[e.id], e, c, 'edit'); const bx = $('boxes').querySelector(`[data-id="${e.id}"]`); if (bx) Object.assign(bx.style, { left: e.x + 'px', top: e.y + 'px', width: e.w + 'px', height: e.h + 'px' }); }
  });
  addEventListener('pointerup', () => { if (!drag) return; const el = drag.el; drag = null; guides([]); el.x = Math.round(Math.max(-el.w + 20, Math.min(page.w - 20, el.x))); el.y = Math.round(Math.max(-el.h + 20, Math.min(page.h - 20, el.y))); save(); draw(); props(); });
  addEventListener('keydown', ev => {
    if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || !page) return;
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') { ev.preventDefault(); back(undo, redo); return; }
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'y') { ev.preventDefault(); back(redo, undo); return; }
    const el = view === 'design' && page.els.find(e => e.id === sel); if (!el) return;
    if (ev.key === 'Delete' || ev.key === 'Backspace') { remember(); page.els = page.els.filter(e => e !== el); sel = null; save(); draw(); props(); return; }
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'd') { ev.preventDefault(); remember(); const n = JSON.parse(JSON.stringify(el)); n.id = P.uid(); n.x += 30; n.y += 30; page.els.push(n); sel = n.id; save(); draw(); props(); return; }
    if (!ev.key.startsWith('Arrow')) return;
    ev.preventDefault(); remember();
    const st = ev.shiftKey ? 10 : 1;
    if (ev.key === 'ArrowLeft') el.x -= st; if (ev.key === 'ArrowRight') el.x += st; if (ev.key === 'ArrowUp') el.y -= st; if (ev.key === 'ArrowDown') el.y += st;
    save(); soft(true);
  });

  // ---------------------------------------------------------------- pasek u góry
  $('pageSel').onchange = () => { loadPage($('pageSel').value); fillPages(); refresh(); };

  const custom = () => { remember(); page.w = Math.min(P.MAXW, Math.max(50, +$('pw').value || 50)); page.h = Math.min(P.MAXH, Math.max(50, +$('ph').value || 50)); save(); draw(); };
  $('pw').onchange = custom; $('ph').onchange = custom;

  $('prevBtn').onclick = () => { P.put(page); window.open('page.html?id=' + page.id, '_blank', `width=${Math.min(page.w, 1280)},height=${Math.min(page.h, 760)}`); };
  $('pilotBtn').onclick = () => { P.put(page); window.open('page.html?pilot=1&id=' + page.id, '_blank', `width=${Math.min(page.w, 1100)},height=${Math.min(page.h + 40, 800)}`); };
  $('delPage').onclick = () => { if (!confirm(`Usunąć stronę „${page.name}”?`)) return; P.remove(page.id); const l = P.list(); if (l.length) { loadPage(l[0].id); fillPages(); refresh(); } else { page = null; showStart(); } };
  $('newBtn').onclick = showStart;
  $('doneBtn').onclick = () => { if (page) P.put(JSON.parse(JSON.stringify(page))); if (embed && parent !== window) parent.postMessage('vm-builder-close', '*'); else window.close(); };
  addEventListener('resize', () => { if (page && view !== 'flow') fit(); });
  setInterval(() => { if (!drag && page && view !== 'flow') { const c = P.ctx(); for (const el of page.els) if (nodes[el.id]) P.drawEl(nodes[el.id], el, c, 'edit'); } }, 1000);

  // start: konkretna strona (?id=) albo „Co robimy?”
  steps();
  const l = P.list(), want = q.get('id') && l.find(p => p.id === q.get('id'));
  if (want) { loadPage(want.id); fillPages(); setView('design'); }
  else { if (l.length) { loadPage(l[0].id); fillPages(); setView('design'); } showStart(); }
})();
</script>
</body>
</html>
