<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Edytor ułożenia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="themes/fonts.css">
<link rel="stylesheet" href="themes/motion.css">
<script src="version.js"></script>
<script src="themes/chat.js"></script>
<script src="themes/layoutedit.js"></script>
<style>
  /*
    Edytor ułożenia: podgląd prawdziwej sceny (layouts.html) i ramki do przeciągania na wierzchu.
    Przyciąganie do siatki 10 px, do krawędzi i środka ekranu oraz do innych elementów (linie pomocnicze).
    Shift przy zmianie rozmiaru = bez trzymania proporcji; strzałki = 1 px, Shift+strzałki = 10 px.
  */
  :root { --bg: #0e0f13; --panel: #171920; --line: #2a2d38; --ink: #e9eaf0; --dim: #9ea1ad; --acc: #7c5cff; --guide: #ff3fa4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.35 'Inter', system-ui, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header, footer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  footer { border-top: 1px solid var(--line); border-bottom: 0; }
  h1 { font-size: 15px; margin: 0 8px 0 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  button { background: #22252f; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; font: inherit; cursor: pointer; }
  button:hover { filter: brightness(1.2); }
  button.on, button.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
  .sp { flex: 1; }
  .dim { color: var(--dim); font-size: 12.5px; }
  main { flex: 1; min-height: 0; display: grid; place-items: center; padding: 12px; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; background: #000; box-shadow: 0 0 0 1px var(--line), 0 10px 40px rgba(0,0,0,.6); }
  #wrap { position: relative; }
  /* udawana gra pod podglądem – widać, gdzie wypada okno gry */
  #fake { position: absolute; inset: 0; background: repeating-linear-gradient(45deg, #1d3b2a 0 40px, #18321f 40px 80px); }
  #fake::after { content: "obraz gry"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 800 90px/1 'Inter', sans-serif; color: rgba(255,255,255,.12); letter-spacing: .1em; text-transform: uppercase; }
  #prev2 { position: absolute; inset: 0; width: 1920px; height: 1080px; border: 0; pointer-events: none; background: transparent; }
  #prev { position: absolute; inset: 0; width: 1920px; height: 1080px; border: 0; pointer-events: none; }
  #boxes { position: absolute; inset: 0; }
  .box.sel { transition: none; }
  .h { transition: transform var(--press) var(--ease-out); } .h:hover { transform: scale(1.15); }
  .box { position: absolute; border: 4px dashed rgba(255,255,255,.55); background: rgba(124,92,255,.08); cursor: move; touch-action: none; }
  .box:hover { border-color: #fff; }
  .box.sel { border: 5px solid var(--acc); background: rgba(124,92,255,.16); z-index: 2; }
  .box .lab { position: absolute; left: 8px; top: 8px; padding: 6px 14px; border-radius: 8px; background: rgba(10,10,16,.85); font: 700 26px/1.2 'Inter', sans-serif; white-space: nowrap; pointer-events: none; }
  .box .sz { position: absolute; right: 8px; bottom: 8px; padding: 4px 10px; border-radius: 6px; background: rgba(10,10,16,.85); font: 600 22px/1 'Space Mono', monospace; color: var(--dim); pointer-events: none; }
  .h { position: absolute; width: 34px; height: 34px; background: var(--acc); border: 4px solid #fff; border-radius: 50%; display: none; touch-action: none; }
  .sel .h { display: block; }
  .h.nw { left: -19px; top: -19px; cursor: nwse-resize; } .h.ne { right: -19px; top: -19px; cursor: nesw-resize; }
  .h.sw { left: -19px; bottom: -19px; cursor: nesw-resize; } .h.se { right: -19px; bottom: -19px; cursor: nwse-resize; }
  .guide { position: absolute; background: var(--guide); pointer-events: none; z-index: 5; }
  .guide.v { width: 3px; top: 0; bottom: 0; } .guide.hz { height: 3px; left: 0; right: 0; }
  #xywh { font-family: 'Space Mono', monospace; font-size: 12.5px; color: var(--dim); }
  #saved { color: #5fd68a; font-size: 12.5px; opacity: 0; transition: opacity .3s; }
  #saved.on { opacity: 1; }
  .tag { padding: 2px 8px; border-radius: 99px; background: #22252f; font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>✥ Ułożenie</h1>
  <div class="seg" id="laySeg">
    <button data-l="game-frame">Gra w ramce</button>
    <button data-l="talk">Rozmowa</button>
    <button data-l="game-full">Gra – pełny ekran</button>
  </div>
  <span class="tag" id="chatTag"></span>
  <span class="tag" id="modeTag"></span>
  <span class="sp"></span>
  <button id="bigBtn" title="Otwórz edytor w osobnym, dużym oknie">↗ Duże okno</button>
  <button class="primary" id="doneBtn">Gotowe</button>
</header>
<main><div id="wrap"><div id="stage"><div id="fake"></div><iframe id="prev" title="podgląd"></iframe><iframe id="prev2" class="prev2" title="karta"></iframe><div id="boxes"></div></div></div></main>
<footer>
  <b id="selName">Kliknij element</b><span id="xywh"></span>
  <button id="centerBtn">↔ Wyśrodkuj</button>
  <button id="resetOne">Przywróć ten</button>
  <button id="resetAll">Wszystko automatycznie</button>
  <span id="saved">zapisane ✓</span>
  <span class="sp"></span>
  <span class="dim">Przeciągnij · róg = rozmiar (Shift: dowolne proporcje) · strzałki = 1 px</span>
</footer>
<script>
(() => {
  const KEY = 'obsGameOverlay.v1', $ = id => document.getElementById(id), L0 = window.VMLayout, SNAP = 10, MAG = 14, MIN = 80;
  const q = new URLSearchParams(location.search), embed = q.get('embed') === '1';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  let bc = null; try { bc = new BroadcastChannel('obsGameOverlay'); } catch {}
  let layout = ['game-frame', 'talk', 'game-full'].includes(q.get('layout')) ? q.get('layout') : 'game-frame';
  let sel = null, rects = {}, els = [], scale = 1, cardScale0 = 1, cardW0 = 1, cardTouched = false;

  const s0 = () => load();
  const L = () => L0.chatLay(s0());
  function readRects() {
    const s = s0(), cl = L(), own = L0.custom(s, layout, cl);
    rects = JSON.parse(JSON.stringify(own || L0.defaults(layout, cl, s)));
    els = L0.elements(layout, cl, s);
    // karta „Teraz gram” (overlay.html) – tylko w grze na pełnym ekranie; rozmiar = wielkość karty
    if (layout === 'game-full' && s.visible !== false) {
      let cr = null; try { cr = JSON.parse(localStorage.getItem('obsGameOverlay.cardRect')); } catch {}
      const sc = +s.scale || 1, w = cr && cr.w ? cr.w * sc / (cr.scale || sc) : 520 * sc, h = cr && cr.h ? cr.h * sc / (cr.scale || sc) : 130 * sc;
      const xy = Array.isArray(s.cardXY) ? s.cardXY : cr ? [cr.x, cr.y] : [40, 1080 - 40 - h];
      els.unshift({ id: 'card', name: 'Karta „Teraz gram”', ratio: w / h });
      rects.card = [+xy[0], +xy[1], w, h]; cardScale0 = sc; cardW0 = w; cardTouched = false;
    }
    $('chatTag').textContent = 'czat: ' + (cl.dir === 'off' ? 'wyłączony' : cl.dir === 'h' ? 'poziomo ' + (cl.side === 'top' ? 'u góry' : 'u dołu') : 'pionowo ' + (cl.side === 'left' ? 'z lewej' : 'z prawej'));
    $('modeTag').textContent = own ? 'własne ułożenie' : 'automatyczne';
  }
  let saveT = 0;
  function save(now) {
    clearTimeout(saveT);
    const go = () => {
      const s = load(), k = L0.keyOf(layout, L());
      s.layoutEdit = { ...(s.layoutEdit || {}) };
      s.layoutEdit[k] = Object.fromEntries(els.filter(e => e.id !== 'card').map(e => [e.id, rects[e.id].map(Math.round)]));
      if (cardTouched && rects.card) {
        const [x, y, w, h] = rects.card, cx = x + w / 2;
        s.cardXY = [Math.round(x), Math.round(y)];
        s.position = (y + h / 2 < 540 ? 't' : 'b') + (cx < 640 ? 'l' : cx > 1280 ? 'r' : 'c');   // strona postaci i ozdób idzie za kartą
        s.scale = Math.round(Math.max(.5, Math.min(2, cardScale0 * w / cardW0)) * 100) / 100;
      }
      try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {}
      if (bc) bc.postMessage('update');
      $('modeTag').textContent = 'własne ułożenie';
      $('saved').classList.add('on'); if (now) { const el = $('saved'); el.classList.remove('vm-pulse'); void el.offsetWidth; el.classList.add('vm-pulse'); } clearTimeout(save.f); save.f = setTimeout(() => $('saved').classList.remove('on'), 1200);
    };
    if (now) go(); else saveT = setTimeout(go, 120);
  }

  function fit() {
    const m = document.querySelector('main'), w = m.clientWidth - 24, h = m.clientHeight - 24;
    scale = Math.max(.1, Math.min(w / 1920, h / 1080));
    $('stage').style.transform = `scale(${scale})`;
    $('wrap').style.width = 1920 * scale + 'px'; $('wrap').style.height = 1080 * scale + 'px';
  }

  function draw() {
    const b = $('boxes'); b.textContent = '';
    for (const e of els) {
      const d = document.createElement('div'); d.className = 'box' + (sel === e.id ? ' sel' : ''); d.dataset.id = e.id;
      d.innerHTML = `<span class="lab"></span><span class="sz"></span><i class="h nw" data-h="nw"></i><i class="h ne" data-h="ne"></i><i class="h sw" data-h="sw"></i><i class="h se" data-h="se"></i>`;
      d.querySelector('.lab').textContent = e.name;
      b.appendChild(d);
    }
    place();
  }
  function place() {
    for (const d of $('boxes').children) {
      const r = rects[d.dataset.id]; if (!r) continue;
      Object.assign(d.style, { left: r[0] + 'px', top: r[1] + 'px', width: r[2] + 'px', height: r[3] + 'px' });
      d.querySelector('.sz').textContent = `${Math.round(r[2])}×${Math.round(r[3])}`;
      d.classList.toggle('sel', d.dataset.id === sel);
    }
    const e = els.find(x => x.id === sel), r = sel && rects[sel];
    $('selName').textContent = e ? e.name : 'Kliknij element';
    $('xywh').textContent = r ? `x ${Math.round(r[0])} · y ${Math.round(r[1])} · ${Math.round(r[2])}×${Math.round(r[3])}` : '';
    for (const id of ['centerBtn', 'resetOne']) $(id).disabled = !e;
  }

  // przyciąganie: krawędzie i środki innych elementów oraz ekranu; potem siatka
  function targets(axis) {
    const t = axis === 'x' ? [0, 960, 1920, 40, 1880] : [0, 540, 1080, 40, 1040];
    for (const e of els) { if (e.id === sel) continue; const r = rects[e.id]; if (!r) continue;
      const a = axis === 'x' ? r[0] : r[1], l = axis === 'x' ? r[2] : r[3];
      t.push(a, a + l / 2, a + l, a - 30, a + l + 30); }        // 30 px = odstęp jak w automatycznym układzie
    return t;
  }
  function snap(v, axis, guides) {
    let best = null;
    for (const t of targets(axis)) { const dd = Math.abs(t - v); if (dd <= MAG / scale * .5 + 4 && (!best || dd < best.d)) best = { t, d: dd }; }
    if (best) { guides.push([axis, best.t]); return best.t; }
    return Math.round(v / SNAP) * SNAP;
  }
  // przesunięcie: przyciąga lewą/środek/prawą krawędź – wybiera najbliższą
  function snapMove(x, len, axis, guides) {
    let best = null;
    for (const off of [0, len / 2, len]) for (const t of targets(axis)) { const dd = Math.abs(t - (x + off)); if (dd <= MAG / scale * .5 + 4 && (!best || dd < best.d)) best = { x: t - off, t, d: dd }; }
    if (best) { guides.push([axis, best.t]); return best.x; }
    return Math.round(x / SNAP) * SNAP;
  }
  function showGuides(g) {
    document.querySelectorAll('.guide').forEach(n => n.remove());
    for (const [axis, t] of g) { const n = document.createElement('div'); n.className = 'guide ' + (axis === 'x' ? 'v' : 'hz'); n.style[axis === 'x' ? 'left' : 'top'] = (t - 1) + 'px'; $('stage').appendChild(n); }
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  let drag = null;
  $('boxes').addEventListener('pointerdown', ev => {
    const box = ev.target.closest('.box'); if (!box) { sel = null; place(); return; }
    sel = box.dataset.id; ev.preventDefault();
    box.setPointerCapture(ev.pointerId);
    drag = { id: sel, h: ev.target.dataset.h || '', x: ev.clientX, y: ev.clientY, r: rects[sel].slice(), box };
    place();
  });
  window.addEventListener('pointermove', ev => {
    if (!drag) return;
    const dx = (ev.clientX - drag.x) / scale, dy = (ev.clientY - drag.y) / scale, [x, y, w, h] = drag.r, g = [];
    const e = els.find(z => z.id === drag.id), ratio = e && e.ratio && !ev.shiftKey ? e.ratio : 0;
    let r;
    if (!drag.h) {
      r = [snapMove(x + dx, w, 'x', g), snapMove(y + dy, h, 'y', g), w, h];
      // poza krawędzią ekranu element stawia opór (guma, stała 0,55) zamiast twardego stopu
      const rb = (d, dim) => (1 - 1 / ((d * .55) / dim + 1)) * dim, band = (v, lo, hi) => v < lo ? lo - rb(lo - v, 220) : v > hi ? hi + rb(v - hi, 220) : v;
      r[0] = band(r[0], 0, 1920 - w); r[1] = band(r[1], 0, 1080 - h);
    } else {
      const W = drag.h.includes('w'), N = drag.h.includes('n');
      let l = x, t = y, rr = x + w, bb = y + h;
      if (W) l = snap(x + dx, 'x', g); else rr = snap(x + w + dx, 'x', g);
      if (N) t = snap(y + dy, 'y', g); else bb = snap(y + h + dy, 'y', g);
      let nw = Math.max(MIN, rr - l), nh = Math.max(MIN, bb - t);
      if (ratio) { if (Math.abs(dx) >= Math.abs(dy)) nh = nw / ratio; else nw = nh * ratio; g.length = 0; }
      r = [W ? x + w - nw : x, N ? y + h - nh : y, nw, nh];
    }
    rects[drag.id] = r; if (drag.id === 'card') cardTouched = true; showGuides(g); place(); save();
  });
  window.addEventListener('pointerup', () => { if (drag) { drag = null; showGuides([]); save(true); } });

  window.addEventListener('keydown', ev => {
    if (!sel || !ev.key.startsWith('Arrow')) return;
    const st = ev.shiftKey ? 10 : 1, r = rects[sel];
    if (ev.key === 'ArrowLeft') r[0] -= st; if (ev.key === 'ArrowRight') r[0] += st;
    if (ev.key === 'ArrowUp') r[1] -= st; if (ev.key === 'ArrowDown') r[1] += st;
    if (sel === 'card') cardTouched = true;
    ev.preventDefault(); place(); save();
  });

  $('centerBtn').onclick = () => { const r = rects[sel]; if (!r) return; r[0] = Math.round((1920 - r[2]) / 2); if (sel === 'card') cardTouched = true; place(); save(true); };
  const dropCard = () => { const s = load(); delete s.cardXY; try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} if (bc) bc.postMessage('update'); };
  $('resetOne').onclick = () => { if (!sel) return; if (sel === 'card') { dropCard(); setTimeout(() => { readRects(); draw(); }, 1600); return; } const s = load(); rects[sel] = L0.defaults(layout, L(), s)[sel]; place(); save(true); };
  $('resetAll').onclick = () => {
    const s = load(), k = L0.keyOf(layout, L()); if (s.layoutEdit) delete s.layoutEdit[k]; if (layout === 'game-full') delete s.cardXY;
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} if (bc) bc.postMessage('update');
    readRects(); draw();
  };
  $('doneBtn').onclick = () => { save(true); if (embed && parent !== window) parent.postMessage('vm-editor-close', '*'); else window.close(); };
  $('bigBtn').hidden = !embed;
  $('bigBtn').onclick = () => { const u = new URL(location.href); u.searchParams.delete('embed'); u.searchParams.set('layout', layout); window.open(u.href, '_blank', 'width=1400,height=860'); };

  function setLayout(l) {
    layout = l; sel = null;
    for (const b of document.querySelectorAll('#laySeg button')) b.classList.toggle('on', b.dataset.l === l);
    $('prev').src = 'layouts.html?layout=' + l;
    $('prev2').src = l === 'game-full' ? 'overlay.html' : 'about:blank';
    $('fake').style.display = l === 'talk' ? 'none' : '';
    readRects(); draw();
  }
  $('laySeg').onclick = e => { const b = e.target.closest('button'); if (b) setLayout(b.dataset.l); };
  // zmiana układu czatu w panelu → inne ramki (każdy układ czatu ma osobne ułożenie)
  let lastKey = '';
  window.addEventListener('storage', e => { if (e.key !== KEY || drag) return; const k = L0.keyOf(layout, L()) + JSON.stringify(L()); if (k !== lastKey) { lastKey = k; readRects(); draw(); } });
  window.addEventListener('resize', fit);
  fit(); setLayout(layout); lastKey = L0.keyOf(layout, L()) + JSON.stringify(L());
})();
</script>
</body>
</html>
