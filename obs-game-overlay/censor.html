<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>VM · Cenzura</title>
<!--
  Warstwa cenzury ekranu (źródło przeglądarki „VM · Cenzura” na samej górze sceny, 1920×1080).
  Wykrywacz czyta tekst z okna na pierwszym planie (wbudowany OCR Windows), a ta warstwa zasłania słowa
  zakazane regulaminem Twitcha (themes/wordfilter.js – ten sam filtr co czat) dokładnie tam, gdzie są na scenie.
  Gdzie okno jest na scenie, podaje panel (obsGameOverlay.censorMap – z OBS WebSocket).
  Żeby zasłona zdążyła przed obrazem: panel → Czat → Moderacja → Cenzura ekranu → „Opóźnij obraz okna o 500 ms”.
  ?test=1 – pokazuje przykładowe zasłony (bez wykrywacza)
-->
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  /* furry cenzurka: puchata naklejka w kolorze prowadzącej postaci – futerko, uszka nad tekstem, odcisk łapki */
  :root { --f1: #e3a43f; --f2: #8a5a2b; --pad: #fff3e6; }
  .cz { position: absolute; border-radius: 40% 40% 14px 14px / 60% 60% 14px 14px; transform: rotate(var(--tilt, -2deg));
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.28) 0 2px, transparent 3px) 0 0 / 9px 9px,
      radial-gradient(circle at 70% 60%, rgba(0,0,0,.14) 0 2px, transparent 3px) 0 0 / 11px 11px,
      linear-gradient(180deg, var(--f1), var(--f2));
    box-shadow: 0 0 0 2px rgba(255,255,255,.85), 0 0 0 4px var(--f2), 0 4px 10px rgba(0,0,0,.45);
    display: grid; place-items: center; animation: cz-in .25s cubic-bezier(.2,1.5,.4,1); }
  @keyframes cz-in { from { transform: rotate(var(--tilt, -2deg)) scale(.4); } }
  /* uszka (tylko na większych zasłonach) */
  .cz.big::before, .cz.big::after { content: ""; position: absolute; top: -13px; width: 20px; height: 18px; background: var(--f1);
    clip-path: polygon(50% 0, 100% 100%, 0 100%); background: linear-gradient(180deg, var(--f1) 45%, #ffb3c1 46%); }
  .cz.big::before { left: 14%; transform: rotate(-14deg); } .cz.big::after { right: 14%; transform: rotate(14deg); }
  .cz svg { height: 78%; max-height: 34px; width: auto; filter: drop-shadow(0 1px 0 rgba(0,0,0,.25)); flex: none; }
  /* zamiennik (furry żart) na naklejce: łapka + delikatne słowo; naklejka może być trochę szersza niż zakryte słowo */
  .cz.rep { display: flex; gap: .3em; padding: 0 .45em; white-space: nowrap; justify-content: center; align-items: center; width: auto !important; min-width: var(--w);
    color: var(--pad); font: 800 var(--fs, 16px)/1 'Baloo 2', 'Nunito', 'Inter', sans-serif; text-shadow: 0 1px 0 rgba(0,0,0,.35); }
  .cz.rep svg { height: .95em; }
  .cz.soft { --f1: #c9a6e0; --f2: #7a5aa0; }
  .dbg { position: absolute; border: 1px solid rgba(0,225,255,.75); border-radius: 2px; pointer-events: none; }
  .dbg.area { border: 2px dashed rgba(255,200,0,.8); }
  #st { position: absolute; right: 8px; top: 8px; font: 600 14px/1.2 system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.6); padding: 4px 8px; border-radius: 6px; display: none; }
  .debug #st { display: block; }
</style>
<script src="version.js"></script>
<script src="themes/games.js"></script>
<script src="themes/fursona.js"></script>
<script src="themes/wordfilter.js"></script>
</head>
<body>
<div id="st"></div>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const KEY = 'obsGameOverlay.v1', MAP = 'obsGameOverlay.censorMap';
  const read = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } };
  const settings = () => read(KEY) || {};
  const hub = () => (window.vmHub ? window.vmHub(settings().localUrl) : 'http://localhost:7777');
  const DEF_EXES = 'notepad.exe,winword.exe,wordpad.exe,excel.exe,powerpnt.exe,onenote.exe,opera.exe,chrome.exe,msedge.exe,firefox.exe,brave.exe,vivaldi.exe,arc.exe,discord.exe,telegram.exe,whatsapp.exe,signal.exe,slack.exe,ms-teams.exe,teams.exe,outlook.exe,olk.exe,thunderbird.exe,obsidian.exe,notion.exe,code.exe,notepad++.exe,sublime_text.exe,acrobat.exe,acrord32.exe,sumatrapdf.exe,steamwebhelper.exe,spotify.exe';
  if (q.get('debug') === '1') document.body.classList.add('debug');
  const st = document.getElementById('st');

  const boxes = new Map();       // klucz → { el, until }
  // odcisk łapki (poduszka + cztery palce)
  const PAW = '<svg viewBox="0 0 40 36" aria-hidden="true"><g fill="var(--pad)"><ellipse cx="20" cy="25" rx="10" ry="8.5"/><ellipse cx="7" cy="14" rx="4" ry="5" transform="rotate(-18 7 14)"/><ellipse cx="15" cy="7" rx="4" ry="5.2"/><ellipse cx="25" cy="7" rx="4" ry="5.2"/><ellipse cx="33" cy="14" rx="4" ry="5" transform="rotate(18 33 14)"/></g></svg>';
  // kolory futerka: prowadząca postać (motyw w ustawieniach)
  function furColors() {
    try {
      const s = settings(), GT = window.OverlayGameThemes, t = String(s.theme || '');
      const d = GT && t.startsWith('g-') ? GT.byId(t.slice(2)) : null;
      if (d && d.accent) { const r = document.documentElement.style; r.setProperty('--f1', d.accent[0]); r.setProperty('--f2', 'color-mix(in srgb, ' + d.accent[0] + ' 55%, #2a1a10)'); }
    } catch {}
  }
  furColors(); setInterval(furColors, 5000);
  function show(list) {
    const hold = (+settings().censorHold || 1500), now = performance.now();
    for (const b of list) {
      const k = Math.round(b.x / 12) + ':' + Math.round(b.y / 12) + ':' + b.t;
      let o = boxes.get(k);
      if (!o) {
        o = { el: document.createElement('div') };
        o.el.className = 'cz' + (b.level === 'soft' ? ' soft' : '') + (b.h >= 18 ? ' big' : '');
        o.el.style.setProperty('--tilt', ((Math.random() * 6) - 3).toFixed(1) + 'deg');
        if (b.rep) { o.el.classList.add('rep'); o.el.innerHTML = PAW + '<span></span>'; o.el.lastChild.textContent = b.rep; }
        else o.el.innerHTML = PAW;
        document.body.appendChild(o.el); boxes.set(k, o);
      }
      Object.assign(o.el.style, { left: b.x - 4 + 'px', top: b.y - 3 + 'px', width: b.w + 8 + 'px', height: b.h + 6 + 'px' });
      if (b.rep) { o.el.style.setProperty('--w', b.w + 8 + 'px'); o.el.style.setProperty('--fs', Math.max(11, Math.min(30, b.h * 0.72)).toFixed(0) + 'px'); }
      o.until = now + hold;
    }
  }
  setInterval(() => { const now = performance.now(); for (const [k, o] of boxes) if (now > o.until) { o.el.remove(); boxes.delete(k); } }, 100);

  // słowo w pikselach ekranu → piksele tej warstwy (1920×1080 = cała scena)
  function project(r, words) {
    const m = read(MAP); if (!m || !m.items || !m.items.length || Date.now() - (m.at || 0) > 15000) return { out: [], why: 'brak mapy sceny (panel w OBS musi być otwarty)' };
    const cw = (m.canvas && m.canvas.w) || 1920, ch = (m.canvas && m.canvas.h) || 1080, kx = 1920 / cw, ky = 1080 / ch;
    let it = m.items.find(i => (i.kind === 'window_capture' || i.kind === 'game_capture') && i.exe && i.exe === r.exe), area = r.client;
    if (!it) { it = m.items.find(i => i.kind === 'monitor_capture'); area = r.monitor; }
    if (!it || !area) return { out: [], why: 'okna ' + r.exe + ' nie ma na tej scenie' };
    const sw = it.srcW || area.w, sh = it.srcH || area.h;
    const fx = it.rect.w / Math.max(1, sw - it.crop[0] - it.crop[2]), fy = it.rect.h / Math.max(1, sh - it.crop[1] - it.crop[3]);
    const ax = sw / area.w, ay = sh / area.h;   // np. zrzut w innej skali niż źródło
    const box = { left: it.rect.x * kx + 'px', top: it.rect.y * ky + 'px', width: it.rect.w * kx + 'px', height: it.rect.h * ky + 'px' };
    return { area: box, out: words.map(w => ({ ...w, x: (it.rect.x + ((w.x - area.x) * ax - it.crop[0]) * fx) * kx, y: (it.rect.y + ((w.y - area.y) * ay - it.crop[1]) * fy) * ky, w: w.w * ax * fx * kx, h: w.h * ay * fy * ky }))
      .filter(b => b.x + b.w > it.rect.x * kx && b.y + b.h > it.rect.y * ky && b.x < (it.rect.x + it.rect.w) * kx && b.y < (it.rect.y + it.rect.h) * ky), why: '' };
  }

  if (q.get('test') === '1') { const T = [{ x: 300, y: 300, w: 140, h: 34, t: 'a', rep: window.VMWords ? VMWords.furry('hard', '', 'abc', settings().lang) : '' }, { x: 900, y: 520, w: 220, h: 40, t: 'b', level: 'soft', rep: window.VMWords ? VMWords.furry('soft', '', 'xyz', settings().lang) : '' }, { x: 600, y: 700, w: 90, h: 26, t: 'c', level: 'swear', rep: window.VMWords ? VMWords.furry('swear', 'kurw', 'kurwa', settings().lang) : '' }]; show(T); setInterval(() => show(T), 1000); return; }

  // prośba o skan co 4 s (wykrywacz sam przestaje, gdy prośby ustaną)
  async function ping() {
    const s = settings();
    if (s.censor === false || s.local === false) return;
    try {
      const m = read(MAP), it = m && (m.items || []).find(i => i.exe && i.kind !== 'monitor_capture');
      const j = await (await fetch(hub() + '/censor/config?on=1&target=' + encodeURIComponent(it ? it.exe : '') + '&exes=' + encodeURIComponent(s.censorAll !== false ? '' : (s.censorExes || DEF_EXES)), { cache: 'no-store' })).json();
      st.textContent = 'OCR: ' + j.status + (j.fps ? ' · ' + j.fps + '/s' : '') + (j.error ? ' · ' + j.error : '');
    } catch { st.textContent = 'wykrywacz nie odpowiada'; }
  }
  ping(); setInterval(ping, 4000);
  let since = 0, busy = false;
  setInterval(async () => {
    const s = settings(); if (s.censor === false || busy || !window.VMWords) return;
    busy = true;
    try {
      const r = await (await fetch(hub() + '/censor?since=' + since, { cache: 'no-store' })).json();
      if (r && r.at && !r.same) {
        since = r.at;
        // podgląd skanera (panel → Cenzura ekranu → „pokaż, co widzi skaner”): każde odczytane słowo w ramce
        document.querySelectorAll('.dbg').forEach(e => e.remove());
        if (s.censorDebug !== false && !r.skip && r.lines) {
          const all = []; for (const l of r.lines) for (const w of l.words || []) all.push(w);
          const p = project(r, all);
          for (const b of p.out) { const d = document.createElement('div'); d.className = 'dbg'; Object.assign(d.style, { left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', height: b.h + 'px' }); document.body.appendChild(d); }
          if (p.area) { const d = document.createElement('div'); d.className = 'dbg area'; Object.assign(d.style, p.area); document.body.appendChild(d); }
          st.style.display = 'block'; if (p.why) st.textContent = p.why;
        } else st.style.display = '';
        if (!r.skip && r.lines) {
          const bad = window.VMWords.lines(r.lines);
          if (bad.length) { const p = project(r, bad); show(p.out); if (p.why) st.textContent = p.why; }
        }
      }
    } catch {}
    busy = false;
  }, 120);
})();
</script>
</body>
</html>
